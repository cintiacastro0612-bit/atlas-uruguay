<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas electoral de Uruguay</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#1d2330; --mut:#5b6472; --line:#e2e5ea;
    --brand:#2a4b9b; --soft:#eef1f6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:15px}
  .wrap{max-width:1120px;margin:0 auto;padding:22px 16px 48px}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  header h1{font-size:22px;margin:0;font-weight:650;letter-spacing:-.01em}
  header .sub{color:var(--mut);font-size:14px}
  .demo{display:inline-block;background:#fff3cd;border:1px solid #f0d98a;color:#7a5b00;
    border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;margin-left:6px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 10px}
  .tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:99px;padding:6px 13px;font-size:13.5px;cursor:pointer}
  .tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .layout{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
  .mapcard,.side{background:var(--card);border:1px solid var(--line);border-radius:14px}
  .mapcard{padding:10px;position:relative}
  svg{width:100%;height:auto;display:block}
  path.dep{stroke:#ffffff;stroke-width:.8;cursor:pointer;transition:opacity .1s}
  path.dep:hover{opacity:.82}
  path.dep.sel{stroke:#1d2330;stroke-width:1.6}
  .tools{display:flex;gap:8px;position:absolute;right:14px;top:14px}
  .tools button{border:1px solid var(--line);background:#fff;border-radius:8px;
    padding:5px 9px;font-size:12.5px;cursor:pointer;color:var(--ink)}
  .side{padding:16px}
  .side h3{margin:0 0 4px;font-size:15px}
  .side .dim{color:var(--mut);font-size:13px;margin-bottom:12px}
  .ficha .win{display:flex;align-items:center;gap:8px;font-weight:650;margin:2px 0 10px}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:0 0 12px}
  .rows .r{display:grid;grid-template-columns:14px 1fr auto auto;gap:8px;align-items:center;
    padding:4px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
  .rows .r b{font-weight:600}
  .rows .r .v{color:var(--mut);font-variant-numeric:tabular-nums}
  .rows .r .p{font-weight:650;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
  .meta{margin-top:12px;font-size:13px;color:var(--mut);line-height:1.5}
  .legend{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .legend .li{display:flex;align-items:center;gap:8px;font-size:13px;padding:2px 0}
  .grad{height:12px;border-radius:6px;margin:6px 0}
  .scaleLbl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
  .src{margin-top:20px;font-size:12px;color:var(--mut);line-height:1.5}
  .err{background:#fde8e8;border:1px solid #f5b5b5;color:#8a1f1f;padding:12px 14px;border-radius:10px}
  @media(max-width:860px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="ttl">Atlas electoral de Uruguay</h1>
    <span class="sub" id="elLabel">—</span>
    <select id="elSel" style="display:none;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13.5px;background:#fff;color:var(--ink)"></select>
    <span class="demo" id="demoTag" style="display:none">DEMO · datos de ejemplo</span>
  </header>

  <div class="tabs" id="tabs"></div>

  <div id="err" class="err" style="display:none"></div>

  <div class="layout">
    <div class="mapcard">
      <div class="tools">
        <button id="dlPng">PNG</button>
        <button id="dlSvg">SVG</button>
      </div>
      <div id="mapHost"><div style="padding:40px;color:#5b6472">Cargando mapa…</div></div>
    </div>
    <aside class="side">
      <div id="ficha" class="ficha">
        <h3>Pasá el mouse por un departamento</h3>
        <div class="dim">o tocalo en el celular</div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="src" id="src"></div>
    </aside>
  </div>
</div>

<script>
// ───────────────── Config ─────────────────
// 1º intenta el GeoJSON local (junto al HTML); si no está, usa el de ECharts.
var GEO_LOCAL = "./uruguay.geo.json";
var GEO_REMOTE = "https://echarts.apache.org/examples/data/asset/geo/uruguay.geo.json";
var DATA_URL  = "./datos_uruguay.json";
var VBW = 820, VBH = 780, PAD = 24;   // viewBox del SVG

var GEO=null, DATA=null, ELECCION=null, MODE="ganador", SELECTED=null, PROJ=null;

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmt(n){return (Number(n)||0).toLocaleString("es-UY");}
function pct(n){return (Math.round(n*10)/10).toLocaleString("es-UY")+" %";}

async function getJSON(url){ var r=await fetch(url); if(!r.ok) throw new Error("HTTP "+r.status+" "+url); return r.json(); }

// ───────────────── Proyección ─────────────────
function buildProjection(geo){
  var lats=[], midLat;
  geo.features.forEach(function(f){ eachRing(f,function(ring){ ring.forEach(function(p){ lats.push(p[1]); }); }); });
  midLat=(Math.min.apply(null,lats)+Math.max.apply(null,lats))/2;
  var k=Math.cos(midLat*Math.PI/180);
  var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  geo.features.forEach(function(f){ eachRing(f,function(ring){ ring.forEach(function(p){
    var x=p[0]*k, y=-p[1];
    if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
  }); }); });
  var w=maxX-minX, h=maxY-minY;
  var s=Math.min((VBW-2*PAD)/w,(VBH-2*PAD)/h);
  var offx=(VBW-s*w)/2, offy=(VBH-s*h)/2;
  return function(lon,lat){ return [ (lon*k-minX)*s+offx, (-lat-minY)*s+offy ]; };
}
function eachRing(feature,cb){
  var g=feature.geometry; if(!g) return;
  if(g.type==="Polygon"){ g.coordinates.forEach(cb); }
  else if(g.type==="MultiPolygon"){ g.coordinates.forEach(function(poly){ poly.forEach(cb); }); }
}
function pathD(feature){
  var d="";
  eachRing(feature,function(ring){
    ring.forEach(function(p,i){ var xy=PROJ(p[0],p[1]); d+=(i===0?"M":"L")+xy[0].toFixed(1)+" "+xy[1].toFixed(1); });
    d+="Z";
  });
  return d;
}

// ───────────────── Datos derivados ─────────────────
function partidos(){ return ELECCION.partidos; }
function partidoById(id){ return partidos().find(function(p){return p.id===id;}); }
function depData(name){ return (ELECCION.departamentos||{})[name]||null; }
function derive(name){
  var d=depData(name); if(!d) return null;
  var votos=d.votos||{}, validos=0;
  partidos().forEach(function(p){ validos+=Number(votos[p.id]||0); });
  var emitidos = d.emitidos!=null ? Number(d.emitidos) : validos; // oficial si viene en el dato
  var ganador=null, max=-1;
  partidos().forEach(function(p){ var v=Number(votos[p.id]||0); if(v>max){max=v;ganador=p.id;} });
  var pctByP={}; partidos().forEach(function(p){ pctByP[p.id]= validos? (Number(votos[p.id]||0)/validos*100):0; });
  var participacion = d.habilitados? (emitidos/d.habilitados*100):null;
  return {votos:votos,emitidos:emitidos,validos:validos,blancos:d.blancos,anulados:d.anulados,ganador:ganador,pct:pctByP,participacion:participacion,habilitados:d.habilitados};
}

// ───────────────── Color ─────────────────
function hex2rgb(h){h=h.replace("#","");return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function mix(hex,t){ // t=0 -> blanco, t=1 -> color
  var c=hex2rgb(hex); var r=Math.round(255+(c[0]-255)*t),g=Math.round(255+(c[1]-255)*t),b=Math.round(255+(c[2]-255)*t);
  return "rgb("+r+","+g+","+b+")";
}
function rangeOf(metric){ // min/max de la métrica actual entre departamentos
  var vals=[]; Object.keys(ELECCION.departamentos).forEach(function(n){ var d=derive(n); if(!d)return;
    if(metric==="participacion"){ if(d.participacion!=null) vals.push(d.participacion); }
    else vals.push(d.pct[metric]||0);
  });
  return [Math.min.apply(null,vals), Math.max.apply(null,vals)];
}
function colorFor(name){
  var d=derive(name); if(!d) return "#e8ebf0";
  if(MODE==="ganador"){
    var p=partidoById(d.ganador)||{color:"#9aa0ad"};
    var t=Math.max(.35,Math.min(1,(d.pct[d.ganador]||0)/55)); // intensidad por % del ganador
    return mix(p.color,t);
  }
  if(MODE==="participacion"){
    var r=rangeOf("participacion"), v=d.participacion==null?r[0]:d.participacion;
    var t=r[1]>r[0]?(v-r[0])/(r[1]-r[0]):.6; return mix("#2f8f5b",.2+.8*t);
  }
  // modo "% partido"
  var p2=partidoById(MODE)||{color:"#2a4b9b"}, rr=rangeOf(MODE), vv=d.pct[MODE]||0;
  var tt=rr[1]>rr[0]?(vv-rr[0])/(rr[1]-rr[0]):.6; return mix(p2.color,.12+.88*tt);
}

// ───────────────── Render ─────────────────
function renderTabs(){
  var h='<button data-m="ganador" class="'+(MODE==="ganador"?"on":"")+'">Ganador</button>';
  partidos().forEach(function(p){ if(p.id==="OT")return;
    h+='<button data-m="'+p.id+'" class="'+(MODE===p.id?"on":"")+'">% '+esc(p.nombre)+'</button>'; });
  h+='<button data-m="participacion" class="'+(MODE==="participacion"?"on":"")+'">Participación</button>';
  $("tabs").innerHTML=h;
  Array.prototype.forEach.call($("tabs").querySelectorAll("button"),function(b){
    b.onclick=function(){ MODE=b.getAttribute("data-m"); renderTabs(); paint(); renderLegend(); };
  });
}
function renderMap(){
  var svg='<svg id="mapsvg" viewBox="0 0 '+VBW+' '+VBH+'" xmlns="http://www.w3.org/2000/svg">';
  GEO.features.forEach(function(f){
    var name=(f.properties&&(f.properties.name||f.properties.name_en))||"";
    svg+='<path class="dep" data-name="'+esc(name)+'" d="'+pathD(f)+'"></path>';
  });
  svg+='</svg>';
  $("mapHost").innerHTML=svg;
  Array.prototype.forEach.call($("mapHost").querySelectorAll("path.dep"),function(pt){
    var name=pt.getAttribute("data-name");
    pt.addEventListener("mouseenter",function(){ showFicha(name); select(pt); });
    pt.addEventListener("click",function(){ showFicha(name); select(pt); });
  });
  paint();
}
function select(pt){ if(SELECTED)SELECTED.classList.remove("sel"); SELECTED=pt; pt.classList.add("sel"); }
function paint(){
  Array.prototype.forEach.call($("mapHost").querySelectorAll("path.dep"),function(pt){
    pt.setAttribute("fill",colorFor(pt.getAttribute("data-name")));
  });
}
function showFicha(name){
  var d=derive(name);
  if(!d){ $("ficha").innerHTML='<h3>'+esc(name)+'</h3><div class="dim">Sin datos en esta elección.</div>'; return; }
  var pg=partidoById(d.ganador)||{nombre:"—",color:"#9aa0ad"};
  var orden=partidos().slice().sort(function(a,b){return (d.votos[b.id]||0)-(d.votos[a.id]||0);});
  var rows=orden.map(function(p){
    return '<div class="r"><span class="sw" style="background:'+p.color+'"></span>'+
           '<b>'+esc(p.nombre)+'</b><span class="v">'+fmt(d.votos[p.id]||0)+'</span>'+
           '<span class="p">'+pct(d.pct[p.id]||0)+'</span></div>';
  }).join("");
  $("ficha").innerHTML='<h3>'+esc(name)+'</h3>'+
    '<div class="win"><span class="sw" style="background:'+pg.color+'"></span>Ganó '+esc(pg.nombre)+'</div>'+
    '<div class="rows">'+rows+'</div>'+
    '<div class="meta">Votos a lemas: <b>'+fmt(d.validos)+'</b> (los % son sobre este total)<br>'+
    (d.blancos!=null?'En blanco: '+fmt(d.blancos)+' · Anulados: '+fmt(d.anulados)+'<br>':'')+
    'Votos emitidos: <b>'+fmt(d.emitidos)+'</b><br>'+
    'Habilitados: '+fmt(d.habilitados)+(d.participacion!=null?' · Participación: <b>'+pct(d.participacion)+'</b>':'')+'</div>';
}
function renderLegend(){
  var h="";
  if(MODE==="ganador"){
    h='<div style="font-weight:600;margin-bottom:6px">Fuerza ganadora</div>';
    partidos().forEach(function(p){ if(p.id==="OT")return;
      h+='<div class="li"><span class="sw" style="background:'+p.color+'"></span>'+esc(p.nombre)+'</div>'; });
    h+='<div class="li" style="color:var(--mut);margin-top:4px">Intensidad = % del ganador</div>';
  } else if(MODE==="participacion"){
    var r=rangeOf("participacion");
    h='<div style="font-weight:600;margin-bottom:6px">Participación</div>'+
      '<div class="grad" style="background:linear-gradient(90deg,'+mix("#2f8f5b",.2)+','+mix("#2f8f5b",1)+')"></div>'+
      '<div class="scaleLbl"><span>'+pct(r[0])+'</span><span>'+pct(r[1])+'</span></div>';
  } else {
    var p=partidoById(MODE)||{nombre:MODE,color:"#2a4b9b"}, rr=rangeOf(MODE);
    h='<div style="font-weight:600;margin-bottom:6px">% '+esc(p.nombre)+'</div>'+
      '<div class="grad" style="background:linear-gradient(90deg,'+mix(p.color,.12)+','+mix(p.color,1)+')"></div>'+
      '<div class="scaleLbl"><span>'+pct(rr[0])+'</span><span>'+pct(rr[1])+'</span></div>';
  }
  $("legend").innerHTML=h;
}

// ───────────────── Export ─────────────────
function svgString(){
  var s=$("mapsvg").cloneNode(true);
  s.setAttribute("xmlns","http://www.w3.org/2000/svg");
  s.insertBefore(mkRect(),s.firstChild);
  return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(s);
}
function mkRect(){var r=document.createElementNS("http://www.w3.org/2000/svg","rect");
  r.setAttribute("x",0);r.setAttribute("y",0);r.setAttribute("width",VBW);r.setAttribute("height",VBH);r.setAttribute("fill","#ffffff");return r;}
function download(name,blob){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1500);}
function baseName(){return "atlas_uruguay_"+ELECCION.id+"_"+MODE;}
$("dlSvg").onclick=function(){ download(baseName()+".svg",new Blob([svgString()],{type:"image/svg+xml"})); };
$("dlPng").onclick=function(){
  var img=new Image(), scale=2;
  img.onload=function(){ var c=document.createElement("canvas"); c.width=VBW*scale;c.height=VBH*scale;
    var ctx=c.getContext("2d"); ctx.scale(scale,scale); ctx.drawImage(img,0,0);
    c.toBlob(function(b){ download(baseName()+".png",b); },"image/png"); };
  img.src="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(svgString())));
};

// ───────────────── Elección activa ─────────────────
function setEleccion(i){
  ELECCION=DATA.elecciones[i]; MODE="ganador"; SELECTED=null;
  history.replaceState(null,"","#"+ELECCION.id);
  $("elLabel").textContent=DATA.elecciones.length>1?"":(ELECCION.label||"");
  $("demoTag").style.display=ELECCION.demo?"inline-block":"none";
  $("src").innerHTML="Fuente: "+esc(ELECCION.fuente||"")+"<br>Mapa base: ECharts (uruguay.geo.json).";
  $("ficha").innerHTML='<h3>Pasá el mouse por un departamento</h3><div class="dim">o tocalo en el celular</div>';
  renderTabs(); renderMap(); renderLegend();
}

// ───────────────── Init ─────────────────
async function init(){
  try{
    try{ GEO=await getJSON(GEO_LOCAL); }catch(e){ GEO=await getJSON(GEO_REMOTE); }
    DATA=await getJSON(DATA_URL);
    PROJ=buildProjection(GEO);
    $("ttl").textContent=DATA.titulo||"Atlas electoral de Uruguay";
    var sel=$("elSel"), hash=location.hash.replace("#","");
    DATA.elecciones.forEach(function(e,i){ sel.insertAdjacentHTML("beforeend",'<option value="'+i+'">'+esc(e.label)+"</option>"); });
    var i0=Math.max(0,DATA.elecciones.findIndex(function(e){return e.id===hash;}));
    sel.value=i0; if(DATA.elecciones.length>1) sel.style.display="inline-block";
    sel.onchange=function(){ setEleccion(Number(sel.value)); };
    setEleccion(i0);
  }catch(e){
    $("err").style.display="block";
    $("err").textContent="No se pudo cargar: "+e.message+". Si abriste el archivo con doble clic, serví la carpeta por HTTP (ver README) o subila a GitHub Pages.";
  }
}
init();
</script>
</body>
</html>
